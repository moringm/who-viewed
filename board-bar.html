<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      display: flex;
      align-items: center;
      height: 100%;
      padding: 0 16px;
      overflow: hidden;
    }

    #viewers {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: nowrap;
      overflow-x: auto;
      width: 100%;
      padding: 8px 0;
    }

    .viewer {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      background: #f4f5f7;
      border-radius: 20px;
      padding: 4px 10px 4px 4px;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .initials {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #0052CC;
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .name {
      font-size: 13px;
      color: #172b4d;
      white-space: nowrap;
      font-weight: 500;
    }

    .last-seen {
      font-size: 10px;
      color: #5e6c84;
      white-space: nowrap;
    }

    #empty {
      color: #5e6c84;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="viewers"><div id="empty" style="display:none">No viewers recorded yet.</div></div>

  <script>
    const SIX_MONTHS = 6 * 30 * 24 * 60 * 60 * 1000;

    var t = TrelloPowerUp.iframe();

    function presenceKey(memberId) {
      return 'presence_' + memberId;
    }

    async function writePresence(t, member) {
      await t.set('board', 'shared', presenceKey(member.id), {
        ts: Date.now(),
        name: member.fullName,
        initials: member.initials,
        avatar: member.avatar
      });
    }

    function getAllViewers(all) {
      const shared = (all.board && all.board.shared) ? all.board.shared : {};
      const now = Date.now();
      return Object.entries(shared)
        .filter(([k, v]) => k.startsWith('presence_') && v && (now - v.ts) < SIX_MONTHS)
        .map(([k, v]) => ({ id: k.replace('presence_', ''), ...v }))
        .sort((a, b) => b.ts - a.ts); // most recent first
    }

    function timeAgo(ts) {
      const diff = Date.now() - ts;
      const minutes = Math.floor(diff / 60000);
      const hours   = Math.floor(diff / 3600000);
      const days    = Math.floor(diff / 86400000);
      const weeks   = Math.floor(days / 7);
      const months  = Math.floor(days / 30);

      if (minutes < 2)   return 'just now';
      if (minutes < 60)  return minutes + 'm ago';
      if (hours < 24)    return hours + 'h ago';
      if (days < 7)      return days + 'd ago';
      if (weeks < 5)     return weeks + 'w ago';
      return months + 'mo ago';
    }

    function renderViewers(viewers, currentMemberId) {
      const container = document.getElementById('viewers');
      const empty = document.getElementById('empty');

      Array.from(container.querySelectorAll('.viewer')).forEach(el => el.remove());

      if (viewers.length === 0) {
        empty.style.display = '';
        return;
      }
      empty.style.display = 'none';

      viewers.forEach(v => {
        const chip = document.createElement('div');
        chip.className = 'viewer';

        if (v.avatar) {
          const img = document.createElement('img');
          img.className = 'avatar';
          img.src = v.avatar + '/30.png';
          img.alt = v.initials;
          img.onerror = () => img.replaceWith(makeInitials(v.initials));
          chip.appendChild(img);
        } else {
          chip.appendChild(makeInitials(v.initials));
        }

        const info = document.createElement('div');
        info.className = 'info';

        const name = document.createElement('span');
        name.className = 'name';
        name.textContent = v.id === currentMemberId ? v.name + ' (you)' : v.name;
        info.appendChild(name);

        const lastSeen = document.createElement('span');
        lastSeen.className = 'last-seen';
        lastSeen.textContent = timeAgo(v.ts);
        info.appendChild(lastSeen);

        chip.appendChild(info);
        container.appendChild(chip);
      });
    }

    function makeInitials(text) {
      const el = document.createElement('div');
      el.className = 'initials';
      el.textContent = text || '?';
      return el;
    }

    var currentMember = null;
    var rendered = false;

    t.render(async function() {
      if (rendered) return;
      rendered = true;

      const member = await t.member('id', 'fullName', 'initials', 'avatar');
      currentMember = member;
      await writePresence(t, member);
      const all = await t.getAll();
      renderViewers(getAllViewers(all), member.id);
    });
  </script>
</body>
</html>
