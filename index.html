<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script>
    const SIX_MONTHS = 6 * 30 * 24 * 60 * 60 * 1000;

    function presenceKey(memberId) {
      return 'presence_' + memberId;
    }

    async function writePresence(t) {
      const member = await t.member('id', 'fullName', 'initials', 'avatar');
      await t.set('board', 'shared', presenceKey(member.id), {
        ts: Date.now(),
        name: member.fullName,
        initials: member.initials,
        avatar: member.avatar
      });
    }

    async function getAllViewers(t) {
      const all = await t.getAll();
      const shared = (all.board && all.board.shared) ? all.board.shared : {};
      const now = Date.now();
      return Object.entries(shared)
        .filter(([k, v]) => k.startsWith('presence_') && v && (now - v.ts) < SIX_MONTHS)
        .map(([k, v]) => ({ id: k.replace('presence_', ''), ...v }))
        .sort((a, b) => b.ts - a.ts); // most recent first
    }

    TrelloPowerUp.initialize({
      'board-buttons': function(t) {
        return writePresence(t)
          .then(() => getAllViewers(t))
          .then(viewers => [{
            icon: {
              dark: window.location.origin + window.location.pathname.replace('index.html', '') + 'icon.svg',
              light: window.location.origin + window.location.pathname.replace('index.html', '') + 'icon.svg'
            },
            text: viewers.length + ' viewer' + (viewers.length === 1 ? '' : 's'),
            callback: function(t) {
              return t.boardBar({
                url: t.signUrl('./board-bar.html'),
                height: 80,
                accentColor: '#0052CC',
                title: "Board Viewers"
              });
            }
          }]);
      }
    });
  </script>
</head>
<body></body>
</html>
